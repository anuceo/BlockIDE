[package]
name = "blockchain-ide"
version = "0.3.0"
description = "A revolutionary blockchain IDE with trust-minimized development environment"
authors = ["Blockchain IDE Team"]
license = "MIT"
repository = "https://github.com/blockchain-ide/blockchain-ide"
edition = "2021"

# Tauri expects a build script that calls tauri_build::build()
build = "build.rs"

[build-dependencies]
tauri-build = "2.5.3"

[dependencies]
tauri = "=2.6.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.16"

# Minimal EVM mock + helpers (no revm)
hex = "0.4"
rand = "0.8"
chrono = "0.4"

# Utils
log = "0.4"
env_logger = "0.11"
thiserror = "2.0"
once_cell = "1.19"

[features]
default = []
