[package]
name = "blockchain-ide"
version = "0.3.0"
description = "A revolutionary blockchain IDE with trust-minimized development environment"
authors = ["Blockchain IDE Team"]
license = "MIT"
repository = "https://github.com/blockchain-ide/blockchain-ide"
edition = "2021"

[build-dependencies]
tauri-build = "2.5.3"

[dependencies]
tauri = { version = "2.9.5" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.0"

# Blockchain & EVM
revm = { version = "6.0.0", features = ["optimism", "serde"], optional = true }
web3 = { version = "0.19", features = ["http"], optional = true }
solana-client = { version = "2.0", optional = true }
solana-sdk = { version = "2.0", optional = true }

# IPFS
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1.0", features = ["full"] }

# Plugin system
sha2 = "0.10"
hex = "0.4"

# Utils
once_cell = "1.19"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"

# File system
tempfile = "3.8"

[features]
default = []
evm = ["revm", "web3"]
solana = ["solana-client", "solana-sdk"]

