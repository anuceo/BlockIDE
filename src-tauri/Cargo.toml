[package]
name = "blockchain-ide"
version = "0.3.0"
description = "A revolutionary blockchain IDE with trust-minimized development environment"
authors = ["Blockchain IDE Team"]
license = "MIT"
repository = "https://github.com/blockchain-ide/blockchain-ide"
edition = "2021"

[build-dependencies]
tauri-build = "2.5.1"

[dependencies]
tauri = "2.5.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_with = "3.0"

# Blockchain & EVM
# Note: these are intentionally omitted for now to keep builds compatible with the
# Rust toolchain available in this environment. The backend modules are stubbed
# and can be wired to real chains once the toolchain/deps are pinned appropriately.

# IPFS
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1.0", features = ["full"] }

# Plugin system
sha2 = "0.10"
hex = "0.4"

# Utils
once_cell = "1.19"
thiserror = "2.0"
log = "0.4"
env_logger = "0.11"
chrono = "0.4"

# File system
tempfile = "3.8"

# Pin to a Cargo-1.82-compatible release (avoids crates requiring edition2024)
dlopen2 = "=0.8.0"

[features]
default = []

